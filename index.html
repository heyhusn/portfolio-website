<!--
  Everything between these markers is REPLACED PER ROUTE at build time by
  scripts/prerender-meta.mjs, which writes a real HTML file for each route.

  This has to be static HTML, not something React sets. Social crawlers —
  X, LinkedIn, Facebook, Slack, WhatsApp — do not execute JavaScript. They
  fetch the document, read the <head>, and leave. Anything a client-side
  library writes after hydration is invisible to every one of them.

  Edit the defaults here; edit the per-route values in the prerender script.
-->

<!--
  ADR-09 / FR-AVT-01: the capability tier is resolved before first paint so the
  document never flashes a motion state it is about to leave. This inline script
  is the only script that runs eagerly; everything else is deferred or lazy.
  It writes data-tier and data-motion on <html>; CSS and React both read them.
-->
<script>
(function () {
  var d = document.documentElement;
  var tier = "LITE";
  var motion = "FULL";
  try {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) motion = "OFF";
    var mem = navigator.deviceMemory || 0;
    var cores = navigator.hardwareConcurrency || 0;
    var conn = navigator.connection || {};
    var slow = conn.saveData === true || /^(slow-)?2g$/.test(conn.effectiveType || "");
    var narrow = Math.min(screen.width, screen.height) < 640;

    /* A mouse or trackpad is AVAILABLE — not "the primary pointer is fine".
       A touchscreen laptop reports a coarse primary pointer and is still
       desktop-class; (pointer: coarse) excluded every one of them. */
    var fine = window.matchMedia("(any-pointer: fine)").matches &&
               window.matchMedia("(any-hover: hover)").matches;

    /* navigator.deviceMemory is Chromium-only. Firefox and Safari report
       nothing, so `mem` is 0 there and a `mem >= 8` gate could never pass —
       every Firefox and Safari visitor was pinned to MID, a Mac Studio
       included, and FULL is the only tier allowed to mount WebGL. Unknown is
       unknown, not small: where the browser tells us nothing, lean on the
       signals it does give (cores, pointer, viewport, network) and let the
       WebGL2 probe in capability.js disqualify a weak GPU on evidence. */
    var memFull = mem === 0 || mem >= 8;
    var memMid = mem === 0 || mem >= 4;

    if (slow) tier = "LITE";
    else if (memFull && cores >= 8 && fine && !narrow) tier = "FULL";
    else if (memMid && cores >= 4 && !narrow) tier = "MID";
    else tier = "LITE";
  } catch (e) { /* stay on LITE */ }
  d.setAttribute("data-tier", tier);
  d.setAttribute("data-motion", motion);
})();
</script>
</head>
